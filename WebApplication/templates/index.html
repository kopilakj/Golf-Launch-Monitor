<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- IMPORTANT FOR MOBILE -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Who's Playing</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}?v=5">
</head>

<body>
    <div class="main-container">
        <h1>WHO'S PLAYING?</h1>

        <div class="player-buttons">
            {% for player in players %}
            <div class="player-container">
                <a href="{{ url_for('select_player', player_id=player['id']) }}">
                    <div class="player">
                        <span>P{{ loop.index }}</span>
                    </div>
                    <div class="label">
                        {{ player['name'] }}
                    </div>
                </a>
            </div>
            {% endfor %}
        </div>

        <div class="bottom-buttons">
            <div class="icon-container">
                <a href="{{ url_for('add_player') }}">
                    <div class="icon">+</div>
                    <div class="button-label">ADD</div>
                </a>
            </div>

            <div class="icon-container">
                <a href="{{ url_for('edit_users') }}">
                    <div class="icon">&#9998</div>
                    <div class="button-label">EDIT</div>
                </a>
            </div>

            <div class="icon-container">
                <a href="{{ url_for('delete_users') }}">
                    <div class="icon">
                        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 6h18"/>
                            <path d="M8 6V4h8v2"/>
                            <path d="M19 6l-1 14H6L5 6"/>
                            <path d="M10 11v6"/>
                            <path d="M14 11v6"/>
                        </svg>
                    </div>
                    <div class="button-label">DELETE</div>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
