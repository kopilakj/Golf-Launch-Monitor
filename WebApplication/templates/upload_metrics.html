<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Swing Data - {{ player_name }}</title>
    <style>
        body { font-family: "Consolas", monospace; background:#f4f4f4; text-align:center; padding-top:50px;}
        h1 { color:#333; margin-bottom:40px;}
        .upload-box {
            background:#505050; color:#7ED957; padding:40px; border-radius:15px; display:inline-block;
        }
        input[type=file] { margin-bottom:20px; }
        button { background:#7ED957; color:#505050; border:none; padding:10px 20px; font-size:1rem; cursor:pointer; border-radius:10px;}
        button:hover { background:#5db73d; }
    </style>
</head>
<body>
    <h1>{{ player_name }} - Upload Swing Data</h1>
    <div class="upload-box">
        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="file" accept=".csv,.json" required><br>
            <button type="submit">Upload & Display Metrics</button>
        </form>
    </div>
</body>
</html>
