<!DOCTYPE html>
<html>
<head>
    <title>Swing Metrics</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #d9d9d9;
            color: black;
            text-align: center;
            margin: 0;
            padding: 40px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 28px;
            color: #7ED957;
            margin-bottom: 40px;
        }

        .metrics-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 800px;
            margin: auto;
        }

        .metric-card {
            background-color: #505050;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.4);
        }

        .metric-title {
            font-size: 18px;
            color: #7ED957;
        }

        .metric-value {
            font-size: 36px;
            font-weight: bold;
            color: white;
            margin-top: 10px;
        }

        .back-btn {
            margin-top: 50px;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            background-color: #444;
            color: #7ED957;
            cursor: pointer;
        }

        .back-btn:hover {
            background-color: #666;
        }

        .trigger-btn {
            padding: 15px 40px;
            font-size: 20px;
            border: none;
            border-radius: 12px;
            background-color: #7ED957;
            color: #333;
            cursor: pointer;
            font-weight: bold;
            margin: 30px auto;
            display: block;
        }

        .trigger-btn:hover {
            background-color: #6bc948;
        }

        .trigger-btn:disabled {
            background-color: #888;
            cursor: not-allowed;
        }

        .status-text {
            font-size: 14px;
            color: #666;
            margin-top: 10px;
        }

        .button-container {
            margin-top: 40px;
        }

        .change-club-btn {
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background-color: #505050;
            color: #7ED957;
            cursor: pointer;
            margin: 10px;
        }

        .change-club-btn:hover {
            background-color: #666;
        }

        /* Motion Detection Toggle Styles */
        .motion-container {
            margin: 30px auto;
            padding: 20px;
            background-color: #404040;
            border-radius: 12px;
            max-width: 400px;
        }

        .motion-title {
            font-size: 16px;
            color: #aaa;
            margin-bottom: 15px;
        }

        .motion-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .motion-toggle-btn {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .motion-toggle-btn.enable {
            background-color: #7ED957;
            color: #333;
        }

        .motion-toggle-btn.enable:hover {
            background-color: #6bc948;
        }

        .motion-toggle-btn.disable {
            background-color: #e74c3c;
            color: white;
        }

        .motion-toggle-btn.disable:hover {
            background-color: #c0392b;
        }

        .motion-toggle-btn:disabled {
            background-color: #666;
            cursor: not-allowed;
        }

        .motion-status {
            font-size: 18px;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
        }

        .motion-status.enabled {
            background-color: #7ED957;
            color: #333;
        }

        .motion-status.disabled {
            background-color: #666;
            color: #ccc;
        }

        .motion-hint {
            font-size: 12px;
            color: #888;
            margin-top: 10px;
        }

    </style>
</head>
<body>

    <h1>{{ player_name }}</h1>
    <h2>{{ club }}</h2>

    <div class="metrics-container">

        {% for key, value in metrics.items() %}
        <div class="metric-card">
            <div class="metric-title">
                {{ key.replace('_', ' ').title() }}
            </div>
            <div class="metric-value">
                {{ value }}
            </div>
        </div>
        {% endfor %}

    </div>

    <!-- Motion Detection Toggle -->
    <div class="motion-container">
        <div class="motion-title">AUTOMATIC SWING DETECTION</div>
        <div class="motion-toggle">
            <span class="motion-status disabled" id="motionStatus">OFF</span>
            <button class="motion-toggle-btn enable" id="motionToggleBtn" onclick="toggleMotion()">
                ENABLE
            </button>
        </div>
        <p class="motion-hint" id="motionHint">Enable to automatically capture when you swing</p>
    </div>

    <!-- Manual Trigger Shot Button -->
    <div class="button-container">
        <button class="trigger-btn" id="triggerBtn" onclick="triggerShot()">
            MANUAL TRIGGER
        </button>
        <p class="status-text" id="statusText">Or click to manually capture a shot</p>
    </div>

    <div class="button-container">
        <a href="{{ url_for('select_club') }}">
            <button class="change-club-btn">Change Club</button>
        </a>
        <a href="{{ url_for('back_to_players') }}">
            <button class="back-btn">Back to Players</button>
        </a>
    </div>

    <script>
        function triggerShot() {
            const btn = document.getElementById('triggerBtn');
            const status = document.getElementById('statusText');
            
            btn.disabled = true;
            btn.textContent = 'CAPTURING...';
            status.textContent = 'Waiting for Sensor Pi...';
            
            fetch('/api/trigger_shot', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'}
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    status.textContent = 'Shot captured! Refreshing...';
                    // Reload page to show new metrics
                    setTimeout(() => location.reload(), 500);
                } else {
                    status.textContent = 'Error: ' + (data.error || 'Unknown error');
                    btn.disabled = false;
                    btn.textContent = 'TRIGGER SHOT';
                }
            })
            .catch(err => {
                status.textContent = 'Error: ' + err.message;
                btn.disabled = false;
                btn.textContent = 'TRIGGER SHOT';
            });
        }

        // =============================================
        // MOTION DETECTION CONTROLS
        // =============================================
        
        let motionEnabled = false;
        
        function updateMotionUI(enabled) {
            const status = document.getElementById('motionStatus');
            const btn = document.getElementById('motionToggleBtn');
            const hint = document.getElementById('motionHint');
            
            motionEnabled = enabled;
            
            if (enabled) {
                status.textContent = 'ON';
                status.className = 'motion-status enabled';
                btn.textContent = 'DISABLE';
                btn.className = 'motion-toggle-btn disable';
                hint.textContent = 'Watching for swings... Page will refresh when shot captured';
            } else {
                status.textContent = 'OFF';
                status.className = 'motion-status disabled';
                btn.textContent = 'ENABLE';
                btn.className = 'motion-toggle-btn enable';
                hint.textContent = 'Enable to automatically capture when you swing';
            }
        }
        
        function toggleMotion() {
            const btn = document.getElementById('motionToggleBtn');
            btn.disabled = true;
            
            const endpoint = motionEnabled ? '/api/motion/disable' : '/api/motion/enable';
            
            fetch(endpoint, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'}
            })
            .then(response => response.json())
            .then(data => {
                btn.disabled = false;
                if (data.motion_enabled !== undefined) {
                    updateMotionUI(data.motion_enabled);
                } else if (data.success) {
                    updateMotionUI(!motionEnabled);
                } else {
                    alert('Error: ' + (data.error || 'Unknown error'));
                }
            })
            .catch(err => {
                btn.disabled = false;
                alert('Error: ' + err.message);
            });
        }
        
        function checkMotionStatus() {
            fetch('/api/motion/status')
            .then(response => response.json())
            .then(data => {
                if (data.motion_enabled !== undefined) {
                    updateMotionUI(data.motion_enabled);
                }
            })
            .catch(err => {
                console.log('Could not check motion status:', err);
            });
        }
        
        // Check motion status on page load
        checkMotionStatus();
        
        // Auto-refresh every 3 seconds when motion detection is enabled
        // This will catch new shots automatically
        setInterval(() => {
            if (motionEnabled) {
                location.reload();
            }
        }, 3000);
    </script>

</body>
</html>
