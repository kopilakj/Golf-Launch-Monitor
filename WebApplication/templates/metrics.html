<!DOCTYPE html>
<html>
<head>
    <title>Swing Metrics</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #d9d9d9;
            color: black;
            text-align: center;
            margin: 0;
            padding: 40px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 28px;
            color: #7ED957;
            margin-bottom: 40px;
        }

        .metrics-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 800px;
            margin: auto;
        }

        .metric-card {
            background-color: #505050;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.4);
        }

        .metric-title {
            font-size: 18px;
            color: #7ED957;
        }

        .metric-value {
            font-size: 36px;
            font-weight: bold;
            color: white;
            margin-top: 10px;
        }

        .back-btn {
            margin-top: 50px;
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background-color: #444;
            color: white;
            cursor: pointer;
        }

        .back-btn:hover {
            background-color: #666;
        }

        .trigger-btn {
            padding: 15px 40px;
            font-size: 20px;
            border: none;
            border-radius: 12px;
            background-color: #7ED957;
            color: #333;
            cursor: pointer;
            font-weight: bold;
            margin: 30px auto;
            display: block;
        }

        .trigger-btn:hover {
            background-color: #6bc948;
        }

        .trigger-btn:disabled {
            background-color: #888;
            cursor: not-allowed;
        }

        .status-text {
            font-size: 14px;
            color: #666;
            margin-top: 10px;
        }

        .button-container {
            margin-top: 40px;
        }

        .change-club-btn {
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background-color: #505050;
            color: #7ED957;
            cursor: pointer;
            margin: 10px;
        }

        .change-club-btn:hover {
            background-color: #666;
        }

    </style>
</head>
<body>

    <h1>{{ player_name }}</h1>
    <h2>{{ club }}</h2>

    <div class="metrics-container">

        {% for key, value in metrics.items() %}
        <div class="metric-card">
            <div class="metric-title">
                {{ key.replace('_', ' ').title() }}
            </div>
            <div class="metric-value">
                {{ value }}
            </div>
        </div>
        {% endfor %}

    </div>

    <!-- Trigger Shot Button for Testing -->
    <div class="button-container">
        <button class="trigger-btn" id="triggerBtn" onclick="triggerShot()">
            TRIGGER SHOT
        </button>
        <p class="status-text" id="statusText">Click to capture a new shot</p>
    </div>

    <div class="button-container">
        <a href="{{ url_for('select_club') }}">
            <button class="change-club-btn">Change Club</button>
        </a>
        <a href="{{ url_for('back_to_players') }}">
            <button class="back-btn">Back to Players</button>
        </a>
    </div>

    <script>
        function triggerShot() {
            const btn = document.getElementById('triggerBtn');
            const status = document.getElementById('statusText');
            
            btn.disabled = true;
            btn.textContent = 'CAPTURING...';
            status.textContent = 'Waiting for Sensor Pi...';
            
            fetch('/api/trigger_shot', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'}
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    status.textContent = 'Shot captured! Refreshing...';
                    // Reload page to show new metrics
                    setTimeout(() => location.reload(), 500);
                } else {
                    status.textContent = 'Error: ' + (data.error || 'Unknown error');
                    btn.disabled = false;
                    btn.textContent = 'TRIGGER SHOT';
                }
            })
            .catch(err => {
                status.textContent = 'Error: ' + err.message;
                btn.disabled = false;
                btn.textContent = 'TRIGGER SHOT';
            });
        }

        // Auto-refresh every 5 seconds to catch new shots
        // (Comment out if you prefer manual refresh only)
        // setInterval(() => location.reload(), 5000);
    </script>

</body>
</html>
