<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Choose Player to Edit</title>
        <style>
            html {
                height: 100%;
                margin: 0;
                padding: 0;
                font-size: 20px
            }

            body {
                background-color: #d9d9d9;
                font-family: "Consolas", monospace;
                text-align: center;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .main-container {
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            /* Who's Playing Container*/
            h1 {
                background-color: #505050;
                color: white;
                display: inline-block;
                padding: 5px 15px;
                border-radius: 20px;
                margin-top: 15px;
                margin-bottom: 60px;
            }

            .player-buttons {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                margin: 20px auto;
                gap: 40px;
                max-width: 850px;
            }

            .player-container {
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            /* Player Button */
            .player {
                width: 110px;
                height: 110px;
                background-color: #505050;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition: background-color 0.2s;
            }

            /* P1, P2, P3, P4 */
            .player span {
                color: #7ED957;
                font-size: 2.5rem;
                font-weight: bold;
            }

            /* Player 1, Player 2, Player 3, Player 4 Label */
            .label {
                font-size: 0.8rem;
                font-weight: bold;
                color: black;
                line-height: 0.5;
                margin-top: 15px;
                align-items: center;
            }

            .back-button {
                background-color: #505050;
                color: #7ED957;
                font-weight: bold;
                padding: 10px 25px;
                border: none;
                border-radius: 10px;
                cursor: pointer;
                font-size: 0.8rem;
            }

            .back-container {
                width: 100%;
                margin-top: 50px;
                text-align: center;
            }

            .back-button:hover {
                background-color: white;
            }

            a {
                text-decoration: none;
                color: inherit;
            }
            
        </style>
    </head>

    <body>
        <div class="main-container">
            <h1> Edit Users </h1>

            <div class="player-buttons">
                {% for player in players %}
                <div class="player-container">
                    <a href = "{{ url_for('edit_player', player_id=player['id']) }}">
                        <div class="player">
                            <span>P{{ loop.index }}</span>
                        </div>
                        <div class="label">
                            {{ player['name'] }}
                        </div>
                    </a>
                </div>
                {% endfor %}
            </div>

            <div class="back-container">
                <a href="{{ url_for('whos_playing') }}">
                    <button class="back-button">&#8592 BACK</button>
                </a>
            </div>
            
        </div>
    </body>
</html>
