    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Who's Playing</title>
        <style>
            html {
                height: 100%;
                margin: 0;
                padding: 0;
                font-size: 20px
            }

            body {
                background-color: #d9d9d9;
                font-family: "Consolas", monospace;
                text-align: center;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .main-container {
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            /* Who's Playing Container*/
            h1 {
                background-color: #505050;
                color: white;
                display: inline-block;
                padding: 5px 15px;
                border-radius: 20px;
                margin-top: 15px;
                margin-bottom: 60px;
            }

            .player-buttons {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                margin: 20px auto;
                gap: 40px;
                max-width: 850px;
            }

            .player-container {
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            /* Player Button */
            .player {
                width: 110px;
                height: 110px;
                background-color: #505050;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition: background-color 0.2s;
            }

            /* P1, P2, P3, P4 */
            .player span {
                color: #7ED957;
                font-size: 2.5rem;
                font-weight: bold;
            }

            /* Player 1, Player 2, Player 3, Player 4 Label */
            .label {
                font-size: 0.8rem;
                font-weight: bold;
                color: black;
                line-height: 0.5;
                margin-top: 15px;
                align-items: center;
            }

            .bottom-buttons {
                display: flex;
                justify-content: center;
                gap: 25px;
                margin-top: 40px;
            }

            /* Icon for Bottom Buttons */ 
            .icon {
                width: 65px;
                height: 65px;
                background-color: #505050;
                border-radius: 50%;
                color: white;
                font-size: 2.2rem;
                line-height: 60px;
            }

            /* Add, Edit, Settings, Shut Down Label */ 
            .button-label {
                font-weight: bold;
                font-size: 0.6rem;
                margin-top: 10px;
            }

            .icon-container {
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            .player:hover {
                background-color: white;
                cursor: pointer;
            }

            .icon:hover{
                background-color: #7ED957;
            }
            
            a {
                text-decoration: none;
                color: inherit;
            }

        </style>
    </head>
    <body>
        <div class="main-container">
            <h1>WHO'S PLAYING?</h1>

            <div class="player-buttons">
                {% for player in players %}
                <div class="player-container">
                    <a href = "{{ url_for('select_player', player_id=player['id']) }}">
                        <div class="player">
                            <span>P{{ loop.index }}</span>
                        </div>
                        <div class="label">
                            {{ player['name'] }}
                        </div>
                    </a>
                </div>
                {% endfor %}
            </div>

            <div class="bottom-buttons">
                <div class="icon-container">
                    <a href="{{ url_for('add_player')}}">
                        <div class="icon">&#43</div>
                        <div class="button-label">ADD USER</div>
                    </a>
                </div>

                <div class="icon-container">
                    <a href="{{ url_for('edit_users')}}">
                        <div class="icon">&#9998</div>
                        <div class="button-label">EDIT USER</div>
                    </a>
                </div>

                <div class="icon-container">
                    <a href="{{ url_for('delete_users')}}">
                        <div class="icon">&#128465</div>
                        <div class="button-label">DELETE USER</div>
                    </a>
                </div>

                <div class="icon-container">
                    <div class="icon" onclick="alert('Shutting Down...')">&#9211</div>
                    <div class="button-label">SHUT DOWN</div>
                </div>
            </div>
        </div>
    </body>
</html>
